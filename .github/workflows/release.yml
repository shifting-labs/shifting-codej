name: Release

# Uploads a release to Maven Central. Nothing is published until a maintainer presses Publish on the
# Central Portal's Deployments page.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 0.164.0-1 or 0.164.0-1-rc1"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check the version's form
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*(-rc[1-9][0-9]*)?$ ]] || { echo "Not <Codex version>-<N>[-rc<k>]: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build, test, sign and upload to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Ppublish,release deploy
